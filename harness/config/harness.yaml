# guarded-mini — checked-in runtime configuration.
#
# NO SECRETS LIVE HERE. The model credential and endpoint are read from the
# environment at runtime (AI_API_KEY, MODEL_BASE_URL, MODEL_NAME) by
# harness/config/__init__.py:read_env(). Nothing in this file is a credential.
#
# Reproducibility (hackathon rule 9): sampling parameters and the seed are
# pinned below. Temperature is a checked-in constant; if an endpoint rejects
# `seed` the harness degrades once, logs the degradation in telemetry, and
# continues without it.

version: 1

agent:
  # Upstream mini-swe-agent limits (interpreted by the vendored core).
  # 0 = unlimited, upstream's own convention: the model — not a wall clock —
  # decides when the task is done (the OpenCode / Kimi Code / Pi posture).
  # Runaway protection lives in the `budget` section below: soft nudges, a
  # stall detector, and a token safety net instead of arbitrary step caps that
  # truncate hard-but-winnable benchmark tasks.
  step_limit: 0
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 3
  # Upstream cost tracking is unreliable on custom OpenAI-compatible endpoints
  # (unknown price tables), so we budget on tokens instead of dollars; see
  # `budget` below and harness/agent.py.
  cost_limit: 0.0

model:
  # Context window (tokens) used by the context-split panel and the report.
  # A checked-in value, not a guess made in code: explicit MODEL_BASE_URL/
  # MODEL_NAME runs use this default, the checked-in providers override it
  # below. Counting is an approximation (tiktoken cl100k; see
  # harness/context/tokens.py) — the panel labels it as such.
  context_limit: 65536
  # Provider defaults used when the evaluator exports only AI_API_KEY (the
  # committee's documented workflow). Explicit MODEL_BASE_URL / MODEL_NAME always
  # take precedence and disable the fallback. This is provider discovery, not
  # model substitution: a key only authenticates against its own provider.
  provider_defaults:
    # DeepSeek first (the committee's default provider). Model IDs follow the
    # official docs (api-docs.deepseek.com): `deepseek-chat`/`deepseek-reasoner`
    # were retired on 2026-07-24; the current IDs are `deepseek-flash`
    # (V4.1-Flash) and `deepseek-v4-pro`, both 1M context.
    - base_url: https://api.deepseek.com/v1
      model_name: deepseek-flash
      context_limit: 1048576
    - base_url: https://api.deepseek.com/v1
      model_name: deepseek-v4-pro
      context_limit: 1048576
    # Qwen via Alibaba Model Studio (DashScope OpenAI-compatible mode). Current
    # IDs per the official model list (help.aliyun.com/model-studio): qwen3.7-plus
    # and qwen3.8-max succeed the retired qwen-plus/qwen-max tiers.
    - base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model_name: qwen3.7-plus
      context_limit: 131072
    - base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model_name: qwen3.8-max
      context_limit: 131072
  # Appended to whatever model_kwargs the entrypoint builds at runtime.
  # temperature/seed are the pinned values requested by rule 9.
  model_kwargs:
    drop_params: true
    temperature: 0.0
    seed: 42
    max_tokens: 4096
  # Unknown model prices on the evaluator endpoint must not crash the run.
  cost_tracking: ignore_errors
  # Retry policy for transient endpoint failures (tenacity is upstream's; this
  # cap is enforced by our model wrapper for the extra "seed unsupported" path).
  request_timeout: 300

budget:
  # Budgets are safety nets, not task limits. Every limit is opt-in: 0 disables
  # it. At `warn_fraction` of an enabled limit the agent receives a wrap-up
  # notice in-context (it can still verify and submit); only at 100% does the
  # run exit gracefully (LimitsExceeded) with partial results in the report.
  # Evaluators who WANT a cap impose one without touching source:
  #   make run BUDGET=20            # wall-clock minutes
  #   make run ARGS="--max-steps 60"
  max_steps: 0
  max_llm_calls: 0
  # Token nets catch true runaways; sized far above any plausible single task
  # (~$2-5 at DeepSeek list prices), so they never decide a real benchmark task.
  max_prompt_tokens: 15000000
  max_completion_tokens: 1000000
  max_wall_seconds: 0
  warn_fraction: 0.8
  # Stall detector: the identical action this many times in a row -> in-context
  # nudge; twice that -> graceful "stuck" exit. This — not a raw step cap — is
  # what actually terminates pathological loops in an unlimited-budget run.
  stall_duplicate_limit: 5

environment:
  # Default per-command timeout (upstream LocalEnvironment semantics).
  command_timeout: 60
  # Observations longer than this are elided by the observation template.
  max_output_chars: 20000

verification:
  # auto  -> detect the project's test command and run it after file changes
  # on    -> force the configured command
  # off   -> disable self-verification (still recorded in the report)
  mode: auto
  timeout_seconds: 180
  # Commands tried in order for auto-detection; first match wins.
  python:
    - "python -m pytest -q"
  node:
    - "npm test --silent"
  generic:
    - "make test"

telemetry:
  dir: reports
  jsonl_name: telemetry.jsonl
  trajectory_name: trajectory.json
  patch_name: patch.diff
  report_name: REPORT.md

scope:
  # Directories that are never in scope for automated edits.
  ignore_globs:
    - ".git/**"
    - ".venv/**"
    - "node_modules/**"
    - "harness/checkpoints/**"
